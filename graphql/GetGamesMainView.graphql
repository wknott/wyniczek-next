query GetGamesMainView($sortBy: GameSortBy = LAST_PLAYED) {
  games(skip: 0, take: 200, sortBy: $sortBy) {
    items {
      id
      name
      thumbnailUrl
      bggRank
      avgPlayingTime2Players
      lastPlayedAt
      inCollection
      resultsCount
      latestResult {
        id
        createdAt
        playingTime
        scores {
          player {
            id
            name
          }
        }
      }
    }
    total
  }
}
